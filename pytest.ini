[pytest]
# CI/dev default: exclude network-bound tests (live MusicBrainz lookups, 60s+).
# Run the full suite including them with:  pytest -m ""
# Run ONLY the slow tier with:             pytest -m slow
addopts = -m "not slow"
markers =
    slow: network-bound tests (live MusicBrainz/Spotify); excluded by default

# Coverage gate: the standing 80% floor lives in .coveragerc (fail_under=80,
# enforced by any --cov run and by CI via scripts/check_component_coverage.py).
# Coverage is run explicitly (tracing ~triples suite time) so it stays out of
# addopts:  pytest --cov=src --cov=app
